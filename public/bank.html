<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мій Банк</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#152a55"><link rel="stylesheet" href="/style.css"><script src="https://unpkg.com/html5-qrcode"></script></head>
<body><main class="wrap"><header><div><small>ВІРТУАЛЬНИЙ БАНК</small><h1>Мій Банк</h1></div><button id="install" class="secondary" hidden>Встановити</button></header>
<section class="panel" id="auth"><h2>Вхід або реєстрація</h2><input id="name" placeholder="Ім'я"><input id="password" type="password" placeholder="Пароль (від 4 символів)"><div class="buttons"><button id="login">Увійти</button><button id="register" class="secondary">Створити рахунок</button></div><p id="authmsg" class="msg"></p></section>
<div id="app" hidden><section class="bankcard"><small>МОЯ ВІРТУАЛЬНА КАРТКА</small><div class="balance" id="balance">0 ₴</div><div class="cardbottom"><span id="username"></span><b id="account"></b></div></section>
<section class="panel"><h2>Операції</h2><h3>Поповнити баланс</h3><div class="buttons"><input id="topupAmount" type="number" min="1" placeholder="Сума, ₴"><button id="topup">Поповнити</button></div><hr><h3>Переказ за номером рахунку</h3><input id="toAccount" inputmode="numeric" placeholder="Номер рахунку отримувача"><input id="transferAmount" type="number" min="1" placeholder="Сума, ₴"><button id="transfer">Переказати</button><hr><h3>Оплатити покупку QR-кодом</h3><button id="scan">Сканувати QR</button><div id="reader"></div><p id="paymsg" class="msg"></p><hr><h3>Робота в магазині</h3><button id="apply" class="secondary">Подати заявку продавцем</button><p id="jobmsg" class="msg"></p></section>
<section class="panel"><h2>Історія операцій</h2><div id="history"></div></section><button id="logout" class="secondary">Вийти</button></div></main><script src="/bank.js"></script></body></html>
