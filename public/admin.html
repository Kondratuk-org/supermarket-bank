<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Керування магазином</title><link rel="stylesheet" href="/style.css"></head><body><main class="wrap"><header><div><small>ПАНЕЛЬ ВЛАСНИКА</small><h1>Магазин</h1></div><a class="link" href="/">До каси</a></header>
